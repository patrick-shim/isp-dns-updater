# Cloudflare DNS Updater configuration.
# Copy this file to config.yaml and set dns.record_name.
# Credential values belong in ./secrets, not in this file.

cloudflare:
  zone_id_file: "/run/secrets/cloudflare_zone_id"
  api_token_file: "/run/secrets/cloudflare_api_token"
  
  # CloudFlare API base URL (usually no need to change)
  api_base_url: "https://api.cloudflare.com/client/v4"

dns:
  # The DNS record name to update
  record_name: "CHANGE_ME.neostation.co.kr"
  
  # Hostnames to resolve for ISP IPs
  isp1_hostname: "isp1.neostation.co.kr"
  isp2_hostname: "isp2.neostation.co.kr"
  
  # DNS record TTL in seconds
  ttl: 120
  
  # Whether to proxy through CloudFlare
  proxied: false

retry:
  # Maximum number of retry attempts for failed operations
  max_retries: 3
  
  # Initial delay in seconds before first retry
  initial_delay: 1.0
  
  # Multiplier for exponential backoff (delay *= backoff_factor)
  backoff_factor: 2.0
  
  # Initial delay for DNS resolution retries
  dns_initial_delay: 2.0

timeouts:
  # Timeout in seconds for CloudFlare API requests
  api_timeout: 30
  
  # Timeout in seconds for DNS resolution
  dns_timeout: 10

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # Docker captures stdout/stderr and rotates it per docker-compose.yml.
  log_file: null
  
  # Log message format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Date format for log messages
  date_format: "%Y-%m-%d %H:%M:%S"
