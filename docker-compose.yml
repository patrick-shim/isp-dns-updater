services:
  dns-updater:
    build:
      context: .
    image: isp-dns-updater:local
    restart: unless-stopped
    init: true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      DNS_UPDATER_CONFIG: /app/config.yaml
      DNS_UPDATER_INTERVAL_SECONDS: "${DNS_UPDATER_INTERVAL_SECONDS:-60}"
      TZ: "${TZ:-Asia/Seoul}"
    secrets:
      - cloudflare_zone_id
      - cloudflare_api_token
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/dns-updater.last-success'; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

secrets:
  cloudflare_zone_id:
    file: ./secrets/cloudflare_zone_id
  cloudflare_api_token:
    file: ./secrets/cloudflare_api_token
