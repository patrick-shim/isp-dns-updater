name: Docker Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build --tag isp-dns-updater:test .

    - name: Test image imports
      run: |
        docker run --rm --entrypoint python isp-dns-updater:test \
          -c "import requests, yaml; import update_dns"
